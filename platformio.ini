[platformio]
default_envs = lilygo-t-display-s3

[env:bpi-leaf-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.psram_freq = 80m
board_build.psram_type = qspi
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi

lib_deps = 
    https://github.com/tttapa/Control-Surface.git#2.1.2
    h2zero/NimBLE-Arduino

build_flags = 
    -D TARGET_BANANA
    -D CS_USE_FREERTOS_THREAD=1
    -D FW_MODE_HYBRID=1
    -DBOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D USB_MANUFACTURER="\"BananaPi\""
    -D USB_PRODUCT="\"MultiFX_Controller\""
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -ffast-math
    -ftree-vectorize
    -fsingle-precision-constant
    -I lib/esp-dsp/modules/fft/include
    -I lib/esp-dsp/modules/common/include
    -I lib/esp-dsp/modules/math/include
    -I lib/esp-dsp/modules/wind/include
    -I lib/esp-dsp/modules/iir/include
    -I src/core
    -I src/dsp
    -I src/dsp/effects
    -I src/hardware
    -I src/control
    -I src/system

[env:lilygo-t-display-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.filesystem = fatfs
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.psram_freq = 80m
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

lib_deps = 
    https://github.com/tttapa/Control-Surface.git#2.1.2
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino

build_unflags =

build_flags = 
    -D TARGET_LILYGO
    -D FW_MODE_HYBRID=1
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -D CS_USE_FREERTOS_THREAD=1
    -ffast-math
    -ftree-vectorize
    -DBOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0 
    -D ARDUINO_USB_CDC_ON_BOOT=1 
    -D CONFIG_SPIRAM_SPEED_80M=1
    -D CONFIG_SPIRAM_MODE_OCT=1
    -D CONFIG_FREERTOS_HZ=1000    
    -D CORE_DEBUG_LEVEL=0    
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -D CONFIG_BT_NIMBLE_PINNED_TO_CORE=1
    -D CONFIG_BT_CTRL_PINNED_TO_CORE=1
    -D CONFIG_BT_NIMBLE_TASK_STACK_SIZE=5120
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -D USB_MANUFACTURER="\"TTGO\""
    -D USB_PRODUCT="\"TTGO\""
    -D CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    -D CONFIG_ESP32S3_INSTRUCTION_CACHE_LINE_64B=y
    -D CONFIG_ESP32S3_INSTRUCTION_CACHE_SIZE_32KB=y
    -I lib/esp-dsp/modules/fft/include
    -I lib/esp-dsp/modules/common/include
    -I lib/esp-dsp/modules/math/include
    -I lib/esp-dsp/modules/wind/include
    -I lib/esp-dsp/modules/iir/include
    -fsingle-precision-constant
    -D USER_SETUP_LOADED=1
    -include include/tft_setup.h
    -I src/core
    -I src/dsp
    -I src/dsp/effects
    -I src/hardware
    -I src/control
    -I src/system